name: Build and Publish Performance Optimizer Package

on:
  push:
    branches: [ main ]
    paths:
      - 'src/components/seo/PerformanceOptimizer.tsx'
      - 'src/utils/performanceMonitor.ts'
      - 'public/sw.js'
      - 'scripts/test-performance.js'
  workflow_dispatch:

jobs:
  build-package:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build performance optimizer package
      run: npm run build:perf-package
      
    - name: Upload package artifacts
      uses: actions/upload-artifact@v4
      with:
        name: performance-optimizer-package
        path: performance-optimizer/
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: performance-optimizer/
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 